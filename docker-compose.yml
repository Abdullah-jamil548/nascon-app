services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nascon
      POSTGRES_PASSWORD: nascon
      POSTGRES_DB: nascon
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nascon -d nascon"]
      interval: 2s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
  minio:
    image: bitnamilegacy/minio:2024.6.13
    environment:
      MINIO_ROOT_USER: nascon
      MINIO_ROOT_PASSWORD: nasconnascon
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql+psycopg://nascon:nascon@db:5432/nascon
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: nascon
      MINIO_SECRET_KEY: nasconnascon
      DAY1_SALT: ${DAY1_SALT}
      DAY2_SALT: ${DAY2_SALT}
      JWT_SECRET: nascon-jwt-dev
      MEDIAMTX_API: http://mediamtx:9997
    networks:
      default:
        aliases:
          - backend
    depends_on:
      db:
        condition: service_healthy
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+psycopg://nascon:nascon@db:5432/nascon
      REDIS_URL: redis://redis:6379/0
      DAY1_SALT: ${DAY1_SALT}
      DAY2_SALT: ${DAY2_SALT}
    depends_on:
      - redis
      - api
  mediamtx:
    image: bluenviron/mediamtx:1.11.3
    ports:
      - "1935:1935"
      - "8888:8888"
      - "8889:8889"
      - "9997:9997"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml
    depends_on:
      - api
  selenium-hub:
    image: selenium/hub:4.25.0
    container_name: nascon-selenium-hub
    ports:
      - "4444:4444"
      - "4442:4442"
      - "4443:4443"
  node-chrome-1:
    image: selenium/node-chrome:4.25.0
    shm_size: "1gb"
    depends_on: [selenium-hub]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
      - SE_START_VNC=false
  node-chrome-2:
    image: selenium/node-chrome:4.25.0
    shm_size: "1gb"
    depends_on: [selenium-hub]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
      - SE_START_VNC=false
  node-firefox:
    image: selenium/node-firefox:4.25.0
    shm_size: "1gb"
    depends_on: [selenium-hub]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
      - SE_START_VNC=false
