name: autograde
on:
  push:
    branches: [main]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: PYTHONPATH=backend DAY1_SALT=demo-salt DAY2_SALT=day2-test-salt python -m pytest tests -q --tb=line
